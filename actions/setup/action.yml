# Generated by smithers-build from //:githubCi. Do not edit; run: smithers-build //:githubCi --write
name: setup
description: Install the workspace toolchain and connect the smithers remote cache.
inputs:
  cache-url:
    description: Exported to the job environment as SMITHERS_CACHE_URL.
    required: false
    default: ""
  cache-token:
    description: Exported to the job environment as SMITHERS_CACHE_TOKEN.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: ">=22.19.0"
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v4
      with:
        path: "~/.pnpm-store"
        key: "pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}"
        restore-keys: pnpm-store-
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Install jj
      uses: taiki-e/install-action@v2
      with:
        tool: jj-cli@0.39.0
    - name: Initialize colocated jj repository
      run: jj git init --colocate
      shell: bash
    - name: Install ripgrep
      uses: taiki-e/install-action@v2
      with:
        tool: ripgrep@14.1.1
    - run: |
        if [ -n "${{ inputs.cache-url }}" ]; then
          echo "SMITHERS_CACHE_URL=${{ inputs.cache-url }}" >> "$GITHUB_ENV"
          echo "SMITHERS_CACHE_TOKEN=${{ inputs.cache-token }}" >> "$GITHUB_ENV"
        fi
      shell: bash
