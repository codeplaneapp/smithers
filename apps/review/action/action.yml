name: smithers review
description: Review pull requests with smithers. Zero secrets — the service authenticates your repo via GitHub OIDC, runs the review on metered inference, and posts the review onto the PR.
author: smithers

inputs:
  service-url:
    description: Base URL of the smithers review service.
    required: false
    default: https://review.jjhub.tech
  quiz:
    description: "Reviewer comprehension quiz mode: off, auto, or on. Empty uses the service/CLI default."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up bun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.1

    # working-directory on the bun steps keeps bun away from any bunfig.toml
    # in the workspace checkout (bun reads bunfig from its cwd; a workspace
    # preload would force auto-install of deps that are not installed there).
    - name: Gate the event
      id: gate
      shell: bash
      working-directory: ${{ github.action_path }}/src
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        SMITHERS_ACTION_PATH: ${{ github.action_path }}
      run: bun "$SMITHERS_ACTION_PATH/src/runGate.ts"

    - name: Set up pnpm
      if: steps.gate.outputs.should-run == 'true'
      uses: pnpm/action-setup@v6.0.8
      with:
        version: 11.21.0
        run_install: false

    - name: Set up node
      if: steps.gate.outputs.should-run == 'true'
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 22.19.0

    - name: Install smithers dependencies
      if: steps.gate.outputs.should-run == 'true'
      shell: bash
      env:
        SMITHERS_ACTION_PATH: ${{ github.action_path }}
      run: pnpm -C "$SMITHERS_ACTION_PATH/../../.." install --frozen-lockfile

    - name: Check out the user's repository
      if: steps.gate.outputs.should-run == 'true'
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Authenticate and review
      if: steps.gate.outputs.should-run == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/src
      env:
        SMITHERS_ACTION_PATH: ${{ github.action_path }}
        SMITHERS_REVIEW_SERVICE_URL: ${{ inputs.service-url }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GH_TOKEN: ${{ github.token }}
        SMITHERS_REVIEW_QUIZ: ${{ inputs.quiz }}
        # Optional bring-your-own inference keys, passed straight through from
        # the caller's job env. `resolveInferenceEnv` picks the provider from
        # whichever is set; absent, inference goes through the metered proxy.
        # The review itself never sees these: `materializeInferenceCredentials`
        # scrubs them and re-supplies only what the chosen mode needs.
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
      run: bun "$SMITHERS_ACTION_PATH/src/runAction.ts"
