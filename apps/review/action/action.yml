name: smithers review analysis
description: Analyze a pull request with read-only repository authority and upload a review payload for isolated publication.
author: smithers

inputs:
  service-url:
    description: Base URL of the smithers review service.
    required: false
    default: https://review.jjhub.tech
  quiz:
    description: "Reviewer comprehension quiz mode: off, auto, or on. Empty uses the service/CLI default."
    required: false
    default: ""
  checkout-path:
    description: Workspace-relative directory used for the untrusted PR checkout.
    required: false
    default: .smithers-review-target

outputs:
  has-review:
    description: Whether analysis produced a publishable review artifact.
    value: ${{ steps.review.outputs.has-review }}
  artifact-name:
    description: Uploaded artifact name consumed by the isolated publisher job.
    value: ${{ steps.review.outputs.artifact-name }}

runs:
  using: composite
  steps:
    - name: Set up bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      env:
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      with:
        bun-version: 1.3.13

    - name: Gate the event
      id: gate
      shell: bash
      working-directory: ${{ github.action_path }}/src
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      run: bun "$GITHUB_ACTION_PATH/src/runGate.ts"

    - name: Set up pnpm
      if: steps.gate.outputs.should-run == 'true'
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      env:
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      with:
        version: 10.10.0
        run_install: false

    - name: Set up node
      if: steps.gate.outputs.should-run == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      env:
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      with:
        node-version: 22

    - name: Install trusted action dependencies
      if: steps.gate.outputs.should-run == 'true'
      shell: bash
      env:
        SMITHERS_ACTION_PATH: ${{ github.action_path }}
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      run: pnpm -C "$SMITHERS_ACTION_PATH/../../.." install --frozen-lockfile

    - name: Install Claude Code CLI
      if: steps.gate.outputs.should-run == 'true'
      shell: bash
      env:
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      run: npm install -g @anthropic-ai/claude-code@2.1.207

    - name: Check out the review target without persisted credentials
      if: steps.gate.outputs.should-run == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      env:
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      with:
        fetch-depth: 0
        persist-credentials: false
        path: ${{ inputs.checkout-path }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Check out the immutable base snapshot without persisted credentials
      if: steps.gate.outputs.should-run == 'true'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      env:
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      with:
        fetch-depth: 1
        persist-credentials: false
        path: .smithers-review-base
        repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.base.sha || github.sha }}

    - name: Analyze with read-only GitHub authority
      id: review
      if: steps.gate.outputs.should-run == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}/src
      env:
        SMITHERS_ACTION_PATH: ${{ github.action_path }}
        SMITHERS_REVIEW_SERVICE_URL: ${{ inputs.service-url }}
        SMITHERS_REVIEW_WORKSPACE: ${{ github.workspace }}/${{ inputs.checkout-path }}
        SMITHERS_REVIEW_BASE_WORKSPACE: ${{ github.workspace }}/.smithers-review-base
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        SMITHERS_REVIEW_QUIZ: ${{ inputs.quiz }}
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
      run: bun "$SMITHERS_ACTION_PATH/src/runAction.ts"

    - name: Upload untrusted review payload
      if: steps.review.outputs.has-review == 'true'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      env:
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      with:
        name: ${{ steps.review.outputs.artifact-name }}
        path: ${{ steps.review.outputs.artifact-path }}
        if-no-files-found: error
        retention-days: 1
