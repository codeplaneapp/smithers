name: smithers review publisher
description: Validate and publish a review artifact without checking out or executing pull request content.
author: smithers

inputs:
  artifact-name:
    description: Exact artifact produced by the read-only analysis job.
    required: true

runs:
  using: composite
  steps:
    - name: Set up bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.13

    - name: Download review payload
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/smithers-review-publish

    - name: Validate event binding and publish
      shell: bash
      working-directory: ${{ github.action_path }}/../src
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        SMITHERS_REVIEW_ARTIFACT_DIR: ${{ runner.temp }}/smithers-review-publish
        CODEX_AUTH_JSON: ""
        CLAUDE_CODE_OAUTH_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        ACTIONS_ID_TOKEN_REQUEST_URL: ""
      run: bun "$GITHUB_ACTION_PATH/../src/publishReview.ts"
