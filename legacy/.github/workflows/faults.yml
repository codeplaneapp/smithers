name: Faults (per-PR)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  faults:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.8
        with:
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Restore nightly flake history
        uses: actions/cache/restore@v4
        with:
          path: .e2e-flakes/history.json
          key: fault-flakes-v1-${{ github.run_id }}
          restore-keys: |
            fault-flakes-v1-

      # apps/cli's dts rollup needs more heap than the runner's default worker
      # limit or tsup dies with ERR_WORKER_OUT_OF_MEMORY.
      - run: pnpm -r build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Enforce promotion gate
        if: github.event_name == 'pull_request'
        env:
          # pnpm --filter runs in e2e/, so these must be absolute or the
          # scripts would read/write e2e/.e2e-flakes/ while the cache and
          # artifact steps below use the repo-root path.
          SMITHERS_E2E_FLAKE_HISTORY: ${{ github.workspace }}/.e2e-flakes/history.json
        run: pnpm --filter @smthrs/e2e check:fault-promotion -- --base-ref "origin/${GITHUB_BASE_REF}"

      - name: Run PR fault matrix
        env:
          SMITHERS_E2E_FLAKE_RESULTS: ${{ github.workspace }}/.e2e-flakes/latest-pr.json
        run: pnpm --filter @smthrs/e2e test:faults

      - name: Upload PR fault results
        if: always()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: fault-results-pr-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: .e2e-flakes/latest-pr.json
