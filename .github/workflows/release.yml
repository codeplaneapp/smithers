name: Release

on:
  push:
    tags:
      - "v*"
  # Rehearsal path. A dispatched run executes every gate, packs the release set,
  # smoke-tests the tarballs, and skips publication while dryRun is true. npm
  # versions are immutable, so this is the only way to exercise the workflow
  # end to end without spending the version under test.
  workflow_dispatch:
    inputs:
      releaseTag:
        description: "Tag to validate, for example v1.0.0-rc.0. Defaults to the dispatched ref."
        type: string
        required: false
        default: ""
      dryRun:
        description: "Run every gate and skip the npm publish step."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: validate, build, and publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      # A tag push releases the tag it pushed. A dispatched run releases the tag
      # it was given, because github.ref_name is a branch name on that path.
      RELEASE_TAG: ${{ inputs.releaseTag != '' && inputs.releaseTag || github.ref_name }}
      # Publication is skipped only on a dispatched dry run. A tag push always
      # publishes: `inputs.dryRun` is absent there, so this resolves to false.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
    steps:
      # Full history and tags. The changelog gate below reads the commit range
      # from the previous v* tag to the tag being released, and the default
      # shallow checkout carries neither the tags nor the commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # actionlint models GitHub's per-key expression-context rules, including
      # the fact that `runner` is available to steps but not a job-level env.
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.11
        with:
          args: ".github/workflows/ci.yml .github/workflows/release.yml .github/workflows/apps-deploy.yml .github/workflows/canary.yml .github/workflows/pr-review.yml"
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Enable the containerd image store
        run: |
          if command -v docker >/dev/null 2>&1 && [ "$(uname -s)" = Linux ] \
            && [ "$(docker info --format '{{.Driver}}' 2>/dev/null)" != overlayfs ]; then
            if [ -f /etc/docker/daemon.json ]; then
              merged="$(jq '.features["containerd-snapshotter"] = true' /etc/docker/daemon.json)"
            else
              merged='{ "features": { "containerd-snapshotter": true } }'
            fi
            printf '%s\n' "$merged" | sudo tee /etc/docker/daemon.json >/dev/null
            sudo systemctl restart docker
            docker info --format 'docker storage driver: {{.Driver}}'
          fi
        shell: bash
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep@14.1.1
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends 'bubblewrap'
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
        shell: bash
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release tags must use the v<version> format." >&2; exit 1 ;;
          esac
          RELEASE_VERSION="${RELEASE_TAG#v}"
          # Smithers 1.0 gives every public first-party package one
          # synchronized version, so the engine and agent groups release
          # together. Tooling is private and never packed. A private manifest
          # is still group-checked, so a package cannot leave the train by
          # dropping its group.
          # The member list comes from `pnpm-workspace.yaml` through the one
          # reader every gate shares, never from a shell glob. Packages nest —
          # a granular package lives inside the product package it belongs to,
          # three directory levels deep — and a glob deep enough to reach one
          # also matches the generated `dist/cjs/package.json` a built package
          # ships, which carries no group and would fail this loop on a build
          # artifact. No package is named here: the published set is the pack
          # manifest, and this loop only checks what the workspace declares.
          for directory in $(node scripts/workspace-packages.mjs --library-dirs); do
            manifest="$directory/package.json"
            package_group="$(node -p "require('./' + process.argv[1]).smthrs?.group ?? ''" "$manifest")"
            case "$package_group" in
              engine|agent) ;;
              tooling) continue ;;
              *) echo "$manifest has missing or unknown smthrs.group '$package_group'." >&2; exit 1 ;;
            esac
            package_private="$(node -p "String(require('./' + process.argv[1]).private === true)" "$manifest")"
            if [ "$package_private" = "true" ]; then continue; fi
            package_version="$(node -p "require('./' + process.argv[1]).version" "$manifest")"
            if [ "$package_version" != "$RELEASE_VERSION" ]; then
              echo "$manifest has version $package_version; expected $RELEASE_VERSION." >&2
              exit 1
            fi
          done
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      # The changelog is generated from the commit range, so a release whose
      # section is missing or stale is a release nobody wrote up. Failing here
      # costs a re-tag; failing after the publish step costs an immutable npm
      # version whose changelog says nothing about it.
      - name: Release changelog section
        run: node scripts/generate-changelog.mjs --check --version "$RELEASE_VERSION"
      # The gate roster below is the required CI `test` job, copied verbatim
      # from the generated .github/workflows/ci.yml, plus the fault matrix the
      # required `e2e-faults` job runs. A release that drove the recursive
      # per-package scripts instead proved a different thing than CI proves,
      # and drifted: those runners need none of the toolchain above, so the
      # 1.0.0-rc.0 dry run reached the std package's ripgrep conformance suite
      # on a runner with no rg binary and failed 25 cases. pack-release.test.mjs
      # compares these blocks against ci.yml, so the copy cannot go stale in
      # silence, and the toolchain block above is a one-line copy per bump.
      - name: Workspace targets
        run: pnpm exec smithers-build ci '//packages/...' --jobs 2
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Examples
        run: pnpm exec smithers-build ci '//examples/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Script gates
        run: pnpm exec smithers-build test '//scripts/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: JSDoc rule harness
        run: pnpm exec smithers-build test '//:jsdocRules'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: "Agent eval suite (offline, baseline-gated)"
        run: pnpm exec smithers-build test '//evals/agent:test'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Agent eval typecheck
        run: pnpm exec smithers-build build '//evals/agent:check'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: "Authoring eval dataset (offline)"
        run: pnpm exec smithers-build test '//evals/authoring:test'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Authoring eval typecheck
        run: pnpm exec smithers-build build '//evals/authoring:check'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: SWE-bench rig typecheck
        run: pnpm exec smithers-build build '//evals/swebench:check'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Review app and workers
        run: pnpm exec smithers-build ci '//apps/review/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Bug worker
        run: pnpm exec smithers-build ci '//apps/bug-worker/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Status site
        run: pnpm exec smithers-build ci '//apps/status-site/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Site
        run: pnpm exec smithers-build ci '//apps/site/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: "Review eval suite (offline, baseline-gated)"
        run: pnpm exec smithers-build test '//evals/review-seeded-bugs/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Review eval typecheck
        run: pnpm exec smithers-build build '//evals/review-seeded-bugs:check'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Generated workflow drift
        run: pnpm exec smithers-build lint '//:ci'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Fault matrix
        run: pnpm exec smithers-build test '//packages/...:faults' --jobs 1
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      # Release-only gates. Neither is in the required CI roster: the
      # disaster-recovery suite is a pinned target rather than part of its
      # package's `ci`, and the version-coherence suite is named here so a
      # rehearsal can run it alone.
      - name: Disaster-recovery script test
        run: pnpm exec smithers-build test '//packages/smithers/flows/engine-store:disasterRecovery'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Release version coherence
        run: pnpm exec smithers-build test '//scripts:releaseVersion'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Build all workspaces from clean artifacts
        run: |
          find packages -type d -name dist -prune -exec rm -rf {} +
          pnpm --recursive --if-present run build
      # Pack from staging manifests whose exports point at built artifacts.
      # Repository manifests retain Effect's source-first export shape.
      - name: Pack and smoke-test release artifacts
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
        run: |
          node scripts/pack-release.mjs "$PACK_DIR"
          node scripts/smoke-release.mjs "$PACK_DIR"
      # The package set and its order come from scripts/pack-release.mjs, which
      # derives membership from the `engine` and `agent` smthrs.group values
      # and order from the workspace dependency edges. Reading manifest.json
      # publishes exactly what the pack step produced, in the packed order, so
      # the lists cannot drift or accidentally include a private package.
      #
      # The plan is computed on both paths, so a dry run reports the exact set,
      # order, version, and dist-tag a real run would publish.
      - name: Compute the publish plan
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
        run: |
          release_version="${RELEASE_TAG#v}"
          # A prerelease never takes `latest`: `npm install smthrs` and every
          # range that tracks the tag must keep resolving 0.35.0 until 1.0.0 is
          # final. Prereleases publish under `next`, which is also pinned in each
          # manifest's publishConfig.tag (the release runbook in Smithers-Ops).
          publish_tag="latest"
          case "$release_version" in *-*) publish_tag="next" ;; esac
          node -e '
            const { readFileSync } = require("node:fs")
            const packed = JSON.parse(readFileSync(process.env.PACK_DIR + "/manifest.json", "utf8"))
            for (const entry of packed) console.log(entry.name + " " + entry.filename)
          ' > "$PUBLISH_ORDER"
          echo "PUBLISH_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PUBLISH_DIST_TAG=$publish_tag" >> "$GITHUB_ENV"
          echo "Publish plan for $release_version on the $publish_tag dist-tag:"
          cat "$PUBLISH_ORDER"
      - name: Publish packages in dependency order
        if: env.DRY_RUN != 'true'
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
          # Trusted publishing (id-token: write) is the primary credential and
          # needs nothing here. This maps the documented token fallback, since a
          # GitHub environment secret is not exported into the step by itself:
          # unset, it is empty and pnpm falls back to trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          while read -r workspace tarball; do
            spec="$workspace@$PUBLISH_VERSION"
            if pnpm view "$spec" version --json >/dev/null 2>&1; then
              echo "$spec is already published; leaving the immutable version in place."
              continue
            fi
            pnpm publish "$PACK_DIR/$tarball" --provenance --access public --tag "$PUBLISH_DIST_TAG"
          done < "$PUBLISH_ORDER"
      - name: Report the skipped publication
        if: env.DRY_RUN == 'true'
        env:
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
        run: |
          echo "Dry run: every gate, the pack, and the smoke test ran. Nothing was published."
          echo "A real run would publish these at $PUBLISH_VERSION on the $PUBLISH_DIST_TAG dist-tag:"
          cat "$PUBLISH_ORDER"
