name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  runtime-conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Browser
            script: test:runtime:browser
          - lane: Cloudflare Workers
            script: test:runtime:cloudflare
          - lane: Vercel
            script: test:runtime:vercel
          - lane: Node.js
            script: test:runtime:node
          - lane: Bun
            script: test:runtime:bun
    name: Runtime conformance -- ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Bun (Bun lane)
        if: matrix.lane == 'Bun'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.13
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium (Browser lane)
        if: matrix.lane == 'Browser'
        run: pnpm -C e2e run test:browser:install
      - name: Run ${{ matrix.lane }}
        run: pnpm -C e2e run ${{ matrix.script }}

  typecheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:effect

      - run: pnpm check:deps

      # Run oxfmt as its own step so a formatting failure is reported as
      # "format:check" rather than hiding inside the lint step (`pnpm lint`
      # chains it too, so a local `pnpm lint` catches it before pushing).
      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm -r typecheck

      - run: pnpm --filter ./.smithers typecheck

      - run: pnpm typecheck:examples

      - run: pnpm typecheck:evals

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu package shards use the same weighted balancer as Windows.
          # Shard 0 is the extras lane: root gates, d.ts freshness, the DDD
          # suite, examples, and the PTY e2e run there in parallel with the
          # package shards instead of serially after a monolithic pass.
          - os: ubuntu-latest
            shard: 0
            total_shards: 3
          - os: ubuntu-latest
            shard: 1
            total_shards: 3
          - os: ubuntu-latest
            shard: 2
            total_shards: 3
          - os: ubuntu-latest
            shard: 3
            total_shards: 3
          - os: windows-latest
            shard: 1
            total_shards: 4
          - os: windows-latest
            shard: 2
            total_shards: 4
          - os: windows-latest
            shard: 3
            total_shards: 4
          - os: windows-latest
            shard: 4
            total_shards: 4
    runs-on: ${{ matrix.os }}
    # Coverage (a second, instrumented pass of the whole suite) runs in its own
    # `coverage` job so the two full passes run in PARALLEL instead of serially.
    # Windows runners are appreciably slower than Linux, so the Windows package
    # tests are split into shards with per-package timeouts.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.13

      # The grep tool shells out to ripgrep (`rg`), which the clean runner image
      # does not ship. Without it packages/smithers file-tool tests spawn-fail
      # with PROCESS_FAILED instead of exercising real search.
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      - run: pnpm install --frozen-lockfile

      # packages/server's browser-session tests drive a real headless Chromium;
      # the runner image's browser cache rarely matches the pinned playwright
      # version, so install it explicitly.
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux' && matrix.shard != 0
        run: pnpm -C packages/server exec playwright install chromium

      - name: Check Bun lockfile
        if: runner.os == 'Linux' && matrix.shard == 0
        run: bun install --frozen-lockfile --offline --lockfile-only

      - name: Run test gates
        if: (runner.os == 'Linux' && matrix.shard == 0) || (runner.os == 'Windows' && matrix.shard == 1)
        # Every gate runs even after a failure so one drift cannot hide the
        # next; the step fails at the end with the full list.
        shell: bash
        run: |
          failed=()
          gate() { echo "::group::$*"; if "$@"; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error title=Gate failed::$*"; failed+=("$*"); fi; }
          gate node scripts/check-single-effect-version.mjs
          gate node scripts/check-dependency-boundaries.mjs
          gate node scripts/check-ui-architecture.mjs
          gate node --test scripts/check-ui-architecture.test.mjs
          gate node scripts/check-docs.mjs
          gate node scripts/check-llms.mjs
          gate node scripts/check-smithers-test-script.mjs
          gate bun test scripts/publish-next.test.mjs scripts/run-workspace-tests-timeout.test.mjs
          if [ "${#failed[@]}" -gt 0 ]; then printf 'Failed gates:\n'; printf '  %s\n' "${failed[@]}"; exit 1; fi

      - name: Run d.ts freshness gate (Linux)
        if: runner.os == 'Linux' && matrix.shard == 0
        run: node scripts/check-dts.mjs

      - name: Run workspace package tests (Linux shard)
        if: runner.os == 'Linux' && matrix.shard != 0
        # Same weighted balancer as Windows, nothing excluded. The generous
        # per-package timeout covers the real-backend migrate and e2e suites
        # (apps/cli's detached-oneshot engines push it past 20 on a loaded
        # runner).
        run: node scripts/run-workspace-tests.mjs --shard ${{ matrix.shard }}/${{ matrix.total_shards }} --timeout-minutes 30

      - name: Run docs-driven-development suite
        if: runner.os == 'Linux' && matrix.shard == 0
        timeout-minutes: 20
        run: pnpm -C .smithers test:ddd

      - name: Run workspace package tests (Windows shard)
        if: runner.os == 'Windows'
        # Keep Windows coverage on packages whose tests are currently
        # platform-clean. The excluded packages still run in the full Linux
        # workspace suite and coverage job, and Windows typecheck continues to
        # cover their compile-time surface.
        # .smithers is the local workflow-pack simulation suite: it leans on
        # shell fixtures, PATH pinning, and a process-wide child_process mock,
        # all of which are POSIX-shaped. It stays fully covered by the Linux
        # workspace suite and the coverage job.
        run: node scripts/run-workspace-tests.mjs --shard ${{ matrix.shard }}/${{ matrix.total_shards }} --timeout-minutes 5 --exclude .smithers,apps/cli,apps/review,packages/accounts,packages/agents,packages/db,packages/engine,packages/sandbox,packages/server,packages/smithers

      # The examples/ tree (porting rules + worked ports) is otherwise only
      # typechecked; run its bun tests so structural porting rules are gated.
      # The context-handoff render test is the no-mocks anti-rot proof for the
      # Aspects + TryCatchFinally + ContinueAsNew handoff embedded in the
      # context-engineering guide (graph render only, no agent CLIs needed).
      - name: Run examples bun tests
        if: (runner.os == 'Linux' && matrix.shard == 0) || (runner.os == 'Windows' && matrix.shard == 1)
        run: bun test examples/bun-port-smithers/components/porting-rules.test.ts examples/context-handoff/workflow.test.ts

      # Real-PTY TUI e2e (picker / input / approval) driven through zmux. These
      # probes need no agent CLI, so they are safe on the clean CI box. The
      # daemon binary is downloaded from the zmux release; tests skip cleanly
      # when ZMUXD is unset, so this step is the only place they actually run.
      # zmux only ships a Linux daemon, so this step is Linux-only; on Windows
      # the tests skip cleanly because ZMUXD is unset.
      - name: Download zmux daemon (linux)
        if: runner.os == 'Linux' && matrix.shard == 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.1.0 --repo smithersai/zmux -p 'zmuxd-linux-x64' --clobber
          chmod +x zmuxd-linux-x64

      - name: Run TUI zmux PTY e2e
        if: runner.os == 'Linux' && matrix.shard == 0
        env:
          ZMUXD: ${{ github.workspace }}/zmuxd-linux-x64
        run: bun test --timeout=120000 apps/cli/tests/tui-zmux.e2e.test.js

  coverage:
    runs-on: ubuntu-latest
    # A second, instrumented pass of the whole workspace (per-package coverage +
    # thresholds). Runs in parallel with `test`; instrumentation makes it slower
    # than the plain suite, so it gets its own generous budget.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.13

      # Same ripgrep dependency as the `test` job (file-tool search tests).
      - run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: pnpm install --frozen-lockfile

      # Same real-Chromium dependency as the `test` job (browser-session tests).
      - name: Install Playwright Chromium
        run: pnpm -C packages/server exec playwright install chromium

      - name: Coverage report
        run: pnpm coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: coverage-workspace
          path: coverage/workspace

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.13

      - run: pnpm install --frozen-lockfile

      - name: Start Postgres
        run: docker compose -f deploy/electric/docker-compose.yml up -d postgres

      - name: Wait for Postgres
        run: |
          for i in {1..60}; do
            if docker compose -f deploy/electric/docker-compose.yml exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U smithers; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/electric/docker-compose.yml ps
          exit 1

      - name: Run Postgres-gated tests
        env:
          SMITHERS_TEST_PG_URL: postgresql://smithers:smithers_pw@127.0.0.1:54329/smithers
        # Run the DB dialect suite separately before the CLI and migration
        # suites. Give every migrate-store test its own bun process. A live
        # PGlite uses >1GB of WASM memory and bun reclaims closed instances
        # lazily, so even sequential tests in one process can exhaust the ~2GB
        # runner ceiling.
        # Each file currently has at most 13 chunked tests; running every chunk
        # for every file preserves coverage while bounding each process to one.
        run: |
          bun test packages/db/tests/db-postgres-dialect.test.js
          bun test apps/cli/tests/*postgres*
          for test_file in \
            packages/smithers/tests/migrateSmithersStore.test.js \
            packages/smithers/tests/migrateSmithersStoreReverse.test.js \
            packages/smithers/tests/migrateSmithersStoreReceipts.test.js \
            packages/smithers/tests/migrateSmithersStorePostgres.test.js; do
            for chunk in {0..12}; do
              SMITHERS_MIGRATE_CHUNKS=13 SMITHERS_MIGRATE_CHUNK="$chunk" bun test "$test_file"
            done
          done
          bun test packages/engine/tests/time-travel-postgres.test.js

      - name: Stop Postgres
        if: always()
        run: docker compose -f deploy/electric/docker-compose.yml down -v
