name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: "workspace graph (coverage gates enforced)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.11
        with:
          args: ".github/workflows/ci.yml .github/workflows/release.yml .github/workflows/apps-deploy.yml .github/workflows/canary.yml .github/workflows/pr-review.yml"
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Enable the containerd image store
        run: |
          if command -v docker >/dev/null 2>&1 && [ "$(uname -s)" = Linux ] \
            && [ "$(docker info --format '{{.Driver}}' 2>/dev/null)" != overlayfs ]; then
            if [ -f /etc/docker/daemon.json ]; then
              merged="$(jq '.features["containerd-snapshotter"] = true' /etc/docker/daemon.json)"
            else
              merged='{ "features": { "containerd-snapshotter": true } }'
            fi
            printf '%s\n' "$merged" | sudo tee /etc/docker/daemon.json >/dev/null
            sudo systemctl restart docker
            docker info --format 'docker storage driver: {{.Driver}}'
          fi
        shell: bash
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep@14.1.1
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends 'bubblewrap'
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
        shell: bash
      - name: Workspace targets
        run: pnpm exec smithers-build ci '//packages/...' --jobs 2
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Examples
        run: pnpm exec smithers-build ci '//examples/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Script gates
        run: pnpm exec smithers-build test '//scripts/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: JSDoc rule harness
        run: pnpm exec smithers-build test '//:jsdocRules'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: "Agent eval suite (offline, baseline-gated)"
        run: pnpm exec smithers-build test '//evals/agent:test'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Agent eval typecheck
        run: pnpm exec smithers-build build '//evals/agent:check'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: "Authoring eval dataset (offline)"
        run: pnpm exec smithers-build test '//evals/authoring:test'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Authoring eval typecheck
        run: pnpm exec smithers-build build '//evals/authoring:check'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: SWE-bench rig typecheck
        run: pnpm exec smithers-build build '//evals/swebench:check'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Review app and workers
        run: pnpm exec smithers-build ci '//apps/review/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Bug worker
        run: pnpm exec smithers-build ci '//apps/bug-worker/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Status site
        run: pnpm exec smithers-build ci '//apps/status-site/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Site
        run: pnpm exec smithers-build ci '//apps/site/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Package docs sites
        run: pnpm exec smithers-build ci '//apps/docs/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: "Review eval suite (offline, baseline-gated)"
        run: pnpm exec smithers-build test '//evals/review-seeded-bugs/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Review eval typecheck
        run: pnpm exec smithers-build build '//evals/review-seeded-bugs:check'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Generated workflow drift
        run: pnpm exec smithers-build lint '//:ci'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  apps-e2e:
    name: "apps e2e (worker + browser)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Assert the runner ships the declared browser
        run: |
          if [ ! -x '/usr/bin/google-chrome' ]; then
            echo '/usr/bin/google-chrome is missing from this runner image.' >&2
            echo 'findBrowser only probes BROWSER_CANDIDATES in apps/ui/src/launch-checklist/BrowserLaunch.ts' >&2
            exit 1
          fi
          '/usr/bin/google-chrome' --version
      - name: UI end-to-end suites
        run: pnpm exec smithers-build test '//apps/ui/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Collect apps-e2e-artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/apps-e2e-artifacts"
          for f in '/tmp/smithers-'*'.png'; do if [ -e "$f" ]; then cp -R -- "$f" "$RUNNER_TEMP/apps-e2e-artifacts"; fi; done
          if [ -e 'apps/reports' ]; then cp -R -- 'apps/reports' "$RUNNER_TEMP/apps-e2e-artifacts/reports"; fi
      - name: Upload apps-e2e-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps-e2e-artifacts
          path: "${{ runner.temp }}/apps-e2e-artifacts"
          if-no-files-found: ignore
  rust:
    name: rust fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cargo lint gates
        run: pnpm exec smithers-build lint '//crates/flows-jj/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Cargo test suite
        run: pnpm exec smithers-build test '//crates/flows-jj:cargoTest'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  wasm-repro:
    name: wasm reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Build-script unit tests
        run: pnpm exec smithers-build test '//crates/flows-jj:buildScript'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Rebuild and byte-compare flows_jj.wasm
        run: pnpm exec smithers-build test '//crates/flows-jj:wasmReproducibility'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  e2e-faults:
    name: fault-injection matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Fault matrix
        run: pnpm exec smithers-build test '//packages/...:faults' --jobs 1
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  browser:
    name: browser bundle gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Browser bundle guard
        run: pnpm exec smithers-build test '//scripts:browserContract'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  packages:
    name: "package suites (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            advisory: false
          - os: macos-latest
            advisory: true
          - os: windows-latest
            advisory: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.advisory }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Enable the containerd image store
        run: |
          if command -v docker >/dev/null 2>&1 && [ "$(uname -s)" = Linux ] \
            && [ "$(docker info --format '{{.Driver}}' 2>/dev/null)" != overlayfs ]; then
            if [ -f /etc/docker/daemon.json ]; then
              merged="$(jq '.features["containerd-snapshotter"] = true' /etc/docker/daemon.json)"
            else
              merged='{ "features": { "containerd-snapshotter": true } }'
            fi
            printf '%s\n' "$merged" | sudo tee /etc/docker/daemon.json >/dev/null
            sudo systemctl restart docker
            docker info --format 'docker storage driver: {{.Driver}}'
          fi
        shell: bash
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ripgrep@14.1.1
      - name: Install system packages
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends 'bubblewrap'
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
        shell: bash
      - name: Package test targets
        run: pnpm exec smithers-build test '//packages/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  review-lints:
    name: "model reviews (advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Review lints
        run: pnpm exec smithers-build review '//...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
