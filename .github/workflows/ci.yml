name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: "workspace graph (coverage gates enforced)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.11
        with:
          args: ".github/workflows/ci.yml .github/workflows/release.yml .github/workflows/apps-deploy.yml .github/workflows/canary.yml"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Workspace targets
        run: pnpm exec smthrs ci '//packages/...' --jobs 2
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Script gates
        run: pnpm exec smthrs test '//scripts/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: "Agent eval suite (offline, baseline-gated)"
        run: pnpm exec smthrs test '//evals/agent:suite'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Agent eval typecheck
        run: pnpm exec smthrs build '//evals/agent:types'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Generated workflow drift
        run: pnpm exec smthrs lint '//:ci'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  apps-e2e:
    name: "apps e2e (worker + browser)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Assert the runner ships the declared browser
        run: |
          if [ ! -x /usr/bin/google-chrome ]; then
            echo '/usr/bin/google-chrome is missing from this runner image.' >&2
            echo 'findBrowser only probes BROWSER_CANDIDATES in apps/ui/src/launch-checklist/BrowserLaunch.ts' >&2
            exit 1
          fi
          /usr/bin/google-chrome --version
      - name: UI end-to-end suites
        run: pnpm exec smthrs test '//apps/ui'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Collect apps-e2e-artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/apps-e2e-artifacts"
          cp -R /tmp/smithers-*.png "$RUNNER_TEMP/apps-e2e-artifacts" 2>/dev/null || true
          cp -R apps/reports "$RUNNER_TEMP/apps-e2e-artifacts/reports" 2>/dev/null || true
      - name: Upload apps-e2e-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps-e2e-artifacts
          path: "${{ runner.temp }}/apps-e2e-artifacts"
          if-no-files-found: ignore
  rust:
    name: rust fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cargo lint gates
        run: pnpm exec smthrs lint '//crates/flows-jj'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Cargo test suite
        run: pnpm exec smthrs test '//crates/flows-jj:cargoTest'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  wasm-repro:
    name: wasm reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Build-script unit tests
        run: pnpm exec smthrs test '//crates/flows-jj:buildScript'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
      - name: Rebuild and byte-compare flows_jj.wasm
        run: pnpm exec smthrs test '//crates/flows-jj:wasmReproducibility'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  bun:
    name: test on bun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Bun-compatible suites
        run: pnpm exec smthrs test '//ci/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  browser:
    name: browser bundle gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Browser bundle guard
        run: pnpm exec smthrs test '//scripts:browserContract'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  node-macos:
    name: "package suites (macOS, advisory)"
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Package test targets
        run: pnpm exec smthrs test '//packages/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
  node-windows:
    name: "package suites (Windows, advisory)"
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Package test targets
        run: pnpm exec smthrs test '//packages/...'
        env:
          SMITHERS_CACHE_URL: "${{ secrets.SMITHERS_CACHE_URL }}"
          SMITHERS_CACHE_TOKEN: "${{ secrets.SMITHERS_CACHE_TOKEN }}"
