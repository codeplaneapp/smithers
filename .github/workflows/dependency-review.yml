name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check dependency graph availability
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          available=false
          for attempt in 1 2 3; do
            if gh api --silent "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" 2>/dev/null; then
              available=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 2))"
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [ "$available" != true ]; then
            echo "::notice title=Dependency graph unavailable::Using the repository-local production vulnerability and license policy instead. Enable the dependency graph for change-level review annotations."
          fi

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only,
            AGPL-3.0-or-later, GPL-1.0-only, GPL-1.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
          retry-on-snapshot-warnings: true

      - name: Check out repository for local policy fallback
        if: steps.dependency-graph.outputs.available != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm for local policy fallback
        if: steps.dependency-graph.outputs.available != 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Set up Node for local policy fallback
        if: steps.dependency-graph.outputs.available != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Materialize frozen production graph
        if: steps.dependency-graph.outputs.available != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Enforce local production dependency policy
        if: steps.dependency-graph.outputs.available != 'true'
        run: pnpm audit:prod
