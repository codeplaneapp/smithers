name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check dependency graph availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          available=false
          for attempt in 1 2 3; do
            if gh api --silent "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom"; then
              available=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 2))"
            fi
          done
          if [ "$available" != true ]; then
            echo "::error title=Dependency graph unavailable::Enable the repository dependency graph so dependency review can enforce vulnerability and license policy."
            exit 1
          fi

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only,
            AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
          retry-on-snapshot-warnings: true
