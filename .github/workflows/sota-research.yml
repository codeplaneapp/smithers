name: Daily Smithers maintenance

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

# Analysis and publication receive disjoint authority. The scheduled job is
# deterministic: credentialed research is intentionally a local/manual task.
permissions: {}

concurrency:
  group: daily-smithers-maintenance
  cancel-in-progress: false

jobs:
  analyze:
    if: github.repository == 'smithersai/smithers' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.pack.outputs.has_changes }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
    steps:
      # This checkout stays owned by the runner and supplies the trusted packer.
      - name: Check out trusted maintenance policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .smithers-maintenance-policy

      - name: Check out analysis workspace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: source

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Restore persistent canary workspace
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: source/.smithers-canary-state
          key: smithers-canary-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            smithers-canary-

      - name: Create isolated analysis user
        shell: bash
        run: |
          sudo useradd --create-home --shell /bin/bash smithers-analyzer
          sudo chown -R smithers-analyzer:smithers-analyzer "$GITHUB_WORKSPACE/source"

      # No repository credential is persisted and no provider/subscription
      # credential is provisioned. These commands perform only deterministic
      # generation, tests, and local CLI smoke checks.
      - name: Run deterministic maintenance
        id: maintenance
        shell: bash
        env:
          ANALYSIS_HOME: /home/smithers-analyzer
        run: |
          fence="$(openssl rand -hex 32)"
          printf '::stop-commands::%s\n' "$fence"
          set +e
          sudo -u smithers-analyzer env -i \
            HOME="$ANALYSIS_HOME" \
            PATH="$PATH" \
            CI=1 \
            SMITHERS_NO_UPDATE_CHECK=1 \
            SMITHERS_NO_SKILL_REFRESH=1 \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            bash -euo pipefail -c '
              cd "$1"
              pnpm install --frozen-lockfile
              pnpm generate:init-pack
              pnpm sota:gen
              bun benchmarks/site/make-site.ts
              pnpm check:sota
              bun test benchmarks/fleet

              run_canary() {
                mode="$1"
                workspace="$2"
                repo="$PWD"
                if [ "$mode" = fresh ]; then
                  rm -rf -- "$workspace"
                fi
                mkdir -p -- "$workspace"
                (
                  cd "$workspace"
                  bun "$repo/apps/cli/src/index.js" init --yes --no-install --no-tutorial --no-skill --format json
                  rm -rf -- node_modules
                  ln -s "$repo/node_modules" node_modules
                  bun "$repo/apps/cli/src/index.js" workflow list --system --format json
                  bun "$repo/apps/cli/src/index.js" graph .smithers/workflows/hello.tsx
                  bun "$repo/apps/cli/src/index.js" memory set workflow:daily-canary canary-probe \
                    "{\"runLabel\":\"github-${GITHUB_RUN_ID}\",\"mode\":\"${mode}\"}" --format json
                  bun "$repo/apps/cli/src/index.js" memory get workflow:daily-canary canary-probe --format json
                )
              }

              run_canary fresh "$HOME/fresh-canary"
              run_canary persistent "$PWD/.smithers-canary-state/persistent"
            ' -- "$GITHUB_WORKSPACE/source"
          status=$?
          set -e
          printf '::%s::\n' "$fence"
          printf '%s\n' "$status" > "$RUNNER_TEMP/smithers-maintenance-status"
          exit "$status"

      - name: Stop isolated processes
        if: always()
        shell: bash
        run: sudo pkill -KILL -u smithers-analyzer 2>/dev/null || true

      - name: Save persistent canary workspace
        if: steps.maintenance.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: source/.smithers-canary-state
          key: smithers-canary-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package bounded maintenance changes
        id: pack
        if: always()
        shell: bash
        env:
          ARTIFACT_NAME: smithers-maintenance-changes-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          artifact="$RUNNER_TEMP/$ARTIFACT_NAME"
          rm -rf -- "$artifact"
          node .smithers-maintenance-policy/scripts/sota-maintenance-artifact.mjs pack \
            --base .smithers-maintenance-policy \
            --source source \
            --output "$artifact" \
            --repository "$GITHUB_REPOSITORY" \
            --base-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-name "$ARTIFACT_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload bounded change artifact
        if: always() && steps.pack.outputs.has_changes == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Upload maintenance diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: smithers-maintenance-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/smithers-maintenance-status
            source/benchmarks/site/index.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail when deterministic maintenance failed
        if: always()
        shell: bash
        run: |
          status="$(cat "$RUNNER_TEMP/smithers-maintenance-status" 2>/dev/null || echo 1)"
          echo "maintenance exit status: $status"
          test "$status" = 0

  publish:
    needs: analyze
    if: needs.analyze.result == 'success' && needs.analyze.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # This job never executes the analysis workspace. It consumes only the
      # size/schema/hash/path/base-bound artifact from the prior job.
      - name: Check out trusted publisher
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .smithers-maintenance-policy

      - name: Check out clean publication base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: source

      - name: Download analyzed changes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ needs.analyze.outputs.artifact_name }}
          path: ${{ runner.temp }}/smithers-maintenance-changes

      - name: Validate, stage, and publish maintenance changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .smithers-maintenance-policy/scripts/sota-maintenance-artifact.mjs publish \
            --artifact "$RUNNER_TEMP/smithers-maintenance-changes" \
            --checkout source \
            --repository "$GITHUB_REPOSITORY" \
            --base-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
