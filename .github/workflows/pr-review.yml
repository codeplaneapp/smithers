name: smithers review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  id-token: write       # proves your repo's identity to the review service
  contents: read        # check out the PR
  pull-requests: write  # post the review

concurrency:
  group: smithers-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This repo pays for its own review inference. rc.0 seats are provider
    # routes, so the credential is an API key: the 0.x CODEX_AUTH_JSON and
    # CLAUDE_CODE_OAUTH_TOKEN secrets existed only because the review spawned a
    # CLI agent, and the action ignores both. Without this secret the action
    # falls back to the service's metered proxy.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: smithersai/smithers/apps/review/action@d55bf6343f79324825c61b079bf11acd89bc0e54
