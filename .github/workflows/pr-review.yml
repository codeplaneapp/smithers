name: smithers review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]

# No workflow-wide token. Analysis and publication receive disjoint authority.
permissions: {}

concurrency:
  group: smithers-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.policy.outputs.should-run }}
      can-publish: ${{ steps.policy.outputs.can-publish }}
    steps:
      # Pull-request code is never used as the action implementation. The
      # server-provided base/default SHA is immutable for this workflow run.
      - name: Check out trusted policy implementation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .smithers-review-action

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Classify event and credential trust
        id: policy
        shell: bash
        working-directory: .smithers-review-action/apps/review/action/src
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: bun runGate.ts

  analyze:
    needs: policy
    if: needs.policy.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      has-review: ${{ steps.metered.outputs.has-review }}
      artifact-name: ${{ steps.metered.outputs.artifact-name }}
    steps:
      - name: Check out trusted action implementation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .smithers-review-action

      - name: Analyze through metered inference
        id: metered
        uses: ./.smithers-review-action/apps/review/action

  publish:
    needs: [policy, analyze]
    if: needs.analyze.outputs.has-review == 'true' && needs.policy.outputs.can-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # This job never checks out the PR head. Its only untrusted input is the
      # size/schema/binding-validated JSON artifact.
      - name: Check out trusted publisher implementation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: .smithers-review-action

      - name: Publish validated review
        uses: ./.smithers-review-action/apps/review/action/publish
        with:
          artifact-name: ${{ needs.analyze.outputs.artifact-name }}
