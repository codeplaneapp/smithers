<svg xmlns="http://www.w3.org/2000/svg" width="846" height="618" viewBox="0 0 846 618" role="img" aria-label="smithers init workflow selection">
  <rect width="846" height="618" rx="14" fill="#080b12"/>
  <rect x="0" y="0" width="846" height="34" rx="14" fill="#111827"/>
  <rect x="0" y="20" width="846" height="18" fill="#111827"/>
  <circle cx="24" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="5" fill="#28c840"/>
  <text x="423" y="22" text-anchor="middle" fill="#9ca3af" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">smithers init workflow selection</text>
  <text xml:space="preserve" fill="#d7dde8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <tspan x="28" y="54"></tspan>
    <tspan x="28" y="74">   smithers init  —  Select workflows to install  (30 / 30 selected)</tspan>
    <tspan x="28" y="94">   Installs to .smithers/ in this repo (plus deps via bun install). Everything stays editable.</tspan>
    <tspan x="28" y="114"></tspan>
    <tspan x="28" y="134">   Start here</tspan>
    <tspan x="28" y="154"> ▶ [✓] hello – getting-started example</tspan>
    <tspan x="28" y="174">   [✓] create-workflow – workflow builder (used by make-workflow)</tspan>
    <tspan x="28" y="194">   [✓] make-workflow-tutorial – first-run workflow builder tutorial</tspan>
    <tspan x="28" y="214">   [✓] route-task – recommend a workflow for a task</tspan>
    <tspan x="28" y="234">   Build &amp; ship</tspan>
    <tspan x="28" y="254">   [✓] implement – code + validate + review loop</tspan>
    <tspan x="28" y="274">   [✓] research-plan-implement – research → plan → implement</tspan>
    <tspan x="28" y="294">   [✓] plan – implementation planning</tspan>
    <tspan x="28" y="314">   [✓] research – deep context gathering</tspan>
    <tspan x="28" y="334">   [✓] review – parallel multi-reviewer</tspan>
    <tspan x="28" y="354">   [✓] debug – validate + review loop</tspan>
    <tspan x="28" y="374">   [✓] improve-test-coverage – add missing tests</tspan>
    <tspan x="28" y="394">   [✓] ralph – exploratory refactoring</tspan>
    <tspan x="28" y="414">   [✓] mission – long-running multi-milestone orchestration</tspan>
    <tspan x="28" y="434">   [✓] kanban – ticket-per-feature parallel work</tspan>
    <tspan x="28" y="454">   [✓] smithering – build + monitor + self-improve loop</tspan>
    <tspan x="28" y="474">   Plan &amp; organize</tspan>
    <tspan x="28" y="494">   [✓] grill-me – interactive Q&amp;A for design decisions</tspan>
    <tspan x="28" y="514">   [✓] ticket-create – single ticket creator</tspan>
    <tspan x="28" y="534">   [✓] tickets-create – bulk ticket creation</tspan>
    <tspan x="28" y="554"></tspan>
    <tspan x="28" y="574">   ↑↓ / jk navigate   space toggle   a toggle-all   enter → next   esc cancel  [1–18/30]</tspan>
  </text>
</svg>
