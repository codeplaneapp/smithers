# Coverage gate for `bun test tests`, this package's only suite runner.
#
# The 1.0 baseline is 100% coverage for every package under `packages/`. This
# package ships as source with a Bun suite instead of the repository Vitest
# configuration, so the threshold is enforced here rather than in a
# `vitest.config.ts`. Nothing enforced it before: `src/rgbChannels.ts` sat at
# 70% lines for the whole 0.x life of the package with a green suite.
#
# `coverage = true` puts the gate on the plain `bun test tests` invocation that
# `package.json` and the `unitTests` target in `BUILD.ts` both run, so there is
# no separate coverage script to forget.
#
# TRAP: the threshold must be the SCALAR form. Bun 1.4.0 parses
# `coverageThreshold = { line = 1, function = 1 }` without complaint and then
# never enforces it -- measured here, a file at 80% functions still exits 0.
# The scalar exits 1 on the same tree. Do not "clarify" this into the table
# form.
#
# The suites themselves are excluded: a `*.test.ts` carries helper branches (a
# rejection path a positive case never takes) that would aim the threshold at
# the tests rather than at `src/`. `tests/paintedPairs.ts` is not a `*.test.ts`,
# so the audited pair table stays measured.
[test]
coverage = true
coverageThreshold = 1
coverageSkipTestFiles = true
