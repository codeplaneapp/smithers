  /v1/rpc/pauseRun:
    post:
      operationId: pauseRun
      summary: "Pause Run"
      description: "Gracefully pause an active run: stop scheduling new tasks, let in-flight tasks finish, then park it resumably."
      tags:
        - "Gateway RPC"
      security:
        -
          bearerAuth:
            - run:write
      x-smithers-api-version: v1
      x-smithers-maturity: stable
      x-smithers-transport: "http+websocket"
      x-smithers-required-scope: run:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - params
              additionalProperties: false
              properties:
                id:
