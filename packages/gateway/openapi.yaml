          application/json:
            schema:
              type: object
              required:
                - method
                - params
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: "Optional caller request id."
                method:
                  const: listScores
                params:
                  type: object
                  properties:
                    runId:
                      type: string
                      description: "Run id whose scorer results to list."
                    nodeId:
                      type: string
                      description: "Optional node id filter."
                  required:
                    - runId
                  additionalProperties: false
            example:
              id: listScores-1
              method: listScores
              params:
                runId: run_01
                nodeId: review
      responses:
        200:
          description: "List Scores response."
          headers:
            X-Smithers-API-Version:
              schema:
                type: string
                enum:
                  - v1
              description: "Stable Smithers Gateway API version."
