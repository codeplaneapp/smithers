openapi: 3.1.0
info:
  title: "Smithers Gateway API"
  version: v1
  description: "Stable v1 Smithers Gateway RPC and REST domain API contract generated from packages/gateway."
servers:
  -
    url: https://gateway.example.com
    description: "Reference Gateway deployment."
security:
  -
    bearerAuth: []
paths:
  /v1/rpc/launchRun:
    post:
      operationId: launchRun
      summary: "Launch Run"
      description: "Start a registered workflow run."
      tags:
        - "Gateway RPC"
      security:
        -
          bearerAuth:
            - run:write
      x-smithers-api-version: v1
      x-smithers-maturity: stable
      x-smithers-transport: "http+websocket"
      x-smithers-required-scope: run:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - params
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: "Optional caller request id."
                method:
                  const: launchRun
                params:
                  type: object
                  properties:
                    workflow:
                      type: string
                      description: "Registered Gateway workflow key."
                    input:
                      type: object
                      description: "Workflow input."
                      properties: {}
                      required: []
                      additionalProperties: true
                    options:
                      type: object
                      description: "Launch options."
                      properties:
                        runId:
                          type: string
                          description: "Optional caller-supplied run id."
                        idempotencyKey:
                          type: string
                          description: "Optional caller idempotency key."
                        maxConcurrency:
                          type: integer
                          minimum: 1
                          description: "Maximum parallel workflow tasks."
                        allowNetwork:
                          type: boolean
                          description: "Allow network access for workflow tools."
                        maxOutputBytes:
                          type: integer
                          minimum: 1
                          description: "Maximum captured output bytes per tool/process."
                        toolTimeoutMs:
                          type: integer
                          minimum: 1
                          description: "Maximum wall-clock time per tool call in milliseconds."
                      required: []
                      additionalProperties: false
                  required:
                    - workflow
                  additionalProperties: false
            example:
              id: launchRun-1
              method: launchRun
              params:
                workflow: deploy
                input:
                  sha: abc123
                options:
                  runId: deploy-abc123
                  allowNetwork: true
      responses:
        200:
          description: "Launch Run response."
          headers:
            X-Smithers-API-Version:
              schema:
                type: string
                enum:
                  - v1
              description: "Stable Smithers Gateway API version."
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - id
                  - ok
                  - apiVersion
                  - payload
                additionalProperties: false
                properties:
                  type:
                    const: res
                  id:
                    type: string
                  ok:
                    const: true
                  apiVersion:
                    const: v1
                  payload:
                    type: object
                    properties:
                      runId:
                        type: string
                        description: "Stable run identifier."
                      workflow:
                        type: string
                        description: "Registered Gateway workflow key."
                    required:
                      - runId
                      - workflow
                    additionalProperties: false
              example:
                type: res
                id: launchRun-1
                ok: true
                apiVersion: v1
                payload:
                  runId: deploy-abc123
                  workflow: deploy
        400:
          description: "The request input failed validation."
          content:
            application/json:
              schema:
                type: object
                required:
                  - type
                  - id
                  - ok
                  - apiVersion
                  - error
                additionalProperties: false
                properties:
                  type:
                    const: res
