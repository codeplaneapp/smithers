  /v1/rpc/listTickets:
    post:
      operationId: listTickets
      summary: "List Tickets"
      description: "List live work docs (tickets/plans/specs/proposals) from `_smithers_docs`; soft-deleted tombstones are never returned."
      tags:
        - "Gateway RPC"
      security:
        -
