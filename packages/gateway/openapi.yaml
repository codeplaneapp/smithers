  /v1/rpc/listScores:
    post:
      operationId: listScores
      summary: "List Scores"
      description: "List scorer/eval results for one run, optionally scoped to a node."
      tags:
        - "Gateway RPC"
      security:
        -
          bearerAuth:
            - score:read
      x-smithers-api-version: v1
