<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 640px; overflow: hidden; }
  .card {
    width: 1280px; height: 640px;
    background: #17140f;
    color: #ece5d8;
    font-family: "DM Sans", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 84px 60px;
    position: relative;
  }
  .card::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 85% 10%, rgba(202, 177, 106, 0.14), transparent 55%);
    pointer-events: none;
  }
  .eyebrow {
    font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #cab16a; font-weight: 700;
  }
  h1 {
    font-size: 74px; line-height: 1.12; font-weight: 700; max-width: 1050px;
    letter-spacing: -0.01em; margin-top: 28px;
  }
  h1 .brass { color: #cab16a; }
  .sub {
    font-size: 30px; line-height: 1.45; color: #b5ac9c; max-width: 980px; margin-top: 26px;
  }
  .footer { display: flex; align-items: center; justify-content: space-between; }
  .cmd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 27px; color: #ece5d8;
    background: #211d16; border: 1px solid #3a3428; border-radius: 8px;
    padding: 18px 28px;
  }
  .cmd .brass { color: #cab16a; font-weight: 700; }
  .brand {
    font-size: 30px; font-weight: 700; letter-spacing: 0.02em; color: #ece5d8;
  }
  .brand span { color: #cab16a; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="eyebrow">Open source · durable runtime for AI agents</div>
      <h1>Agent workflows with <span class="brass">time travel.</span></h1>
      <div class="sub">Watch every step live. Rewind, fork, or replay any run from any point. Durable by default. Claude Code, Codex, Gemini, any model or harness.</div>
    </div>
    <div class="footer">
      <div class="cmd"><span class="brass">$</span> bunx smthrs init</div>
      <div class="brand">smithers<span>.sh</span></div>
    </div>
  </div>
</body>
</html>
